<!doctype html>
<html>
<head>

  <title>Vēlinai</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="../code/map-base.css">
  <link rel="stylesheet" href="../code/map-ui.css">
  <link rel="stylesheet" href="../code/map-layers.css">
</head>
<body>
  <div id="map"></div>

  <div id="coords" style="position: fixed; bottom: 10px; left: 10px; color: white; background: rgba(0,0,0,0.5); padding: 4px 8px; border-radius: 4px; font-family: monospace; z-index: 1000;"></div>

  <div class="info-box" id="infoBox">
    <h3>Vēlinai</h3>
    <p>
    Population: ~35 515 332

    <br>

    GDP: 110 097 529.2 GC
    <br>
    GDP per capita: 3.1 GC
    <br>
    (1 Gold Coin = $585)

    Symbol & Colors:
    <img src="../../images/iod/velinai/flag_velinai.png" alt="Flag Vēlinai"  style="width:274px;height:334px;">
  </p>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    // map setup
    const mapWidth = 2048;
    const mapHeight = 2048;
    const bounds = [[0, 0], [mapHeight, mapWidth]];
    const map = L.map('map', {
      crs: L.CRS.Simple,
      minZoom: -1,
      maxZoom: 4,
      maxBounds: bounds,
      maxBoundsViscosity: 1.0
    }).fitBounds(bounds);

    // coords display
    map.on('mousemove', e => {
      const coordDiv = document.getElementById('coords');
      const x = Math.round(e.latlng.lng);
      const y = Math.round(e.latlng.lat);
      coordDiv.innerHTML = `X: ${x}, Y: ${y}`;
    });

    // base images (paths relative to this file)
    const blank = L.imageOverlay('../images/island_of_death/velinai.webp', bounds).addTo(map);
    const temperature = L.imageOverlay('../images/island_of_death/velinai_temperature.webp', bounds);

    const baseMaps = {
      "Blank": blank,
      "Temperature": temperature
    };

    // single control (only one)
    L.control.layers(baseMaps, null).addTo(map);

    // info / invisible markers
    const invisibleIcon = L.divIcon({
      className: 'invisible-marker',
      iconSize: [25, 25],
      iconAnchor: [12, 12]
    });

    const townLayer = L.layerGroup();
    const citiesLayer = L.layerGroup();
    const temperatureLayer = L.layerGroup();

    // Towns
    const towns = [
        // Main Island 1-14 (G) 15-19 (T) 20-24 (P)
      { name: "1", coords: [847, 943], url: ".html" },
      { name: "2", coords: [883, 1013], url: ".html" },
      { name: "3", coords: [834, 850], url: ".html" },
      { name: "4", coords: [832, 1028], url: ".html" },
      { name: "5", coords: [851, 1160], url: ".html" },
      { name: "6", coords: [856, 1327], url: ".html" },
      { name: "7", coords: [670, 1403], url: ".html" },
      { name: "8", coords: [984, 1318], url: ".html" },
      { name: "9", coords: [1096, 1450], url: ".html" },
      { name: "10", coords: [1247, 1281], url: ".html" },
      { name: "11", coords: [1299, 1166], url: ".html" },
      { name: "12", coords: [1186, 1025], url: ".html" },
      { name: "13", coords: [982, 871], url: ".html" },
      { name: "14", coords: [909, 659], url: ".html" },
      { name: "15", coords: [616, 1179], url: ".html" },
      { name: "16", coords: [719, 1059], url: ".html" },
      { name: "17", coords: [547, 1019], url: ".html" },
      { name: "18", coords: [571, 848], url: ".html" },
      { name: "19", coords: [412, 803], url: ".html" },
      { name: "20", coords: [281, 1109], url: ".html" },
      { name: "21", coords: [302, 1241], url: ".html" },
      { name: "22", coords: [422, 1190], url: ".html" },
      { name: "23", coords: [524, 1306], url: ".html" },
      { name: "24", coords: [620, 1281], url: ".html" },
        // Second Island + IOD land (O)
      { name: "25", coords: [1485, 1552], url: ".html" },
      { name: "26", coords: [1382, 1387], url: ".html" },
      { name: "27", coords: [1514, 1343], url: ".html" },
      { name: "28", coords: [1331, 1671], url: ".html" },
      { name: "29", coords: [1038, 1760], url: ".html" },
      { name: "30", coords: [623, 1876], url: ".html" },
        // Third Island (G)
      { name: "31", coords: [1938, 665], url: ".html" },
      { name: "32", coords: [1871, 688], url: ".html" },
      { name: "33", coords: [1932, 519], url: ".html" },
      { name: "34", coords: [1789, 613], url: ".html" },
      { name: "35", coords: [1592, 583], url: ".html" },
      { name: "36", coords: [1477, 667], url: ".html" },
      { name: "37", coords: [1688, 747], url: ".html" },
      { name: "38", coords: [1814, 862], url: ".html" },
    ];
    towns.forEach(town => {
      const marker = L.marker(town.coords, { icon: invisibleIcon })
        .bindPopup(`<a class='popup-link' href='${town.url}'>${town.name}</a>`);
      townLayer.addLayer(marker);
    });

    map.addLayer(townLayer);

    // Temperature markers
    const tecoldZone = L.marker([591, 1166], {
      icon: L.divIcon({
        className: 'temp-label',
        html: '5°C',
        iconSize: [50, 20],
        iconAnchor: [25, 10]
      })
    });
    const ncoldCoords = [
      [855, 361],
      [378, 230],
      [1229, 347]
    ];
    ncoldCoords.forEach(coord => {
      const n = L.marker(coord, {
        icon: L.divIcon({
          className: 'temp-label',
          html: '-16°C',
          iconSize: [50, 20],
          iconAnchor: [25, 10]
        })
      });
      temperatureLayer.addLayer(n);
    });
    const kccoldCoords = [
      [567, 344],
      [671, 1477],
      [1197, 994]
    ];
    kccoldCoords.forEach(coord => {
      const m = L.marker(coord, {
        icon: L.divIcon({
          className: 'temp-label',
          html: '3°C',
          iconSize: [50, 20],
          iconAnchor: [25, 10]
        })
      });
      temperatureLayer.addLayer(m);
    });
    const ccoldCoords = [
      [360, 1051],
      [725, 856],
      [768, 1970]
    ];
    ccoldCoords.forEach(coord => {
      const c = L.marker(coord, {
        icon: L.divIcon({
          className: 'temp-label',
          html: '7°C',
          iconSize: [50, 20],
          iconAnchor: [25, 10]
        })
      });
      temperatureLayer.addLayer(c);
    });

    temperatureLayer.addLayer(tecoldZone);

    // unified baselayerchange handler
    map.on('baselayerchange', function(e) {
      // remove everything first
      map.removeLayer(townLayer);
      map.removeLayer(citiesLayer);
      map.removeLayer(temperatureLayer);

      if (e.name === "Blank") {
        map.addLayer(hamletLayer);
        map.addLayer(townLayer);
        map.addLayer(fortressLayer);
      } else if (e.name === "Temperature") {
        map.addLayer(temperatureLayer);
      }
    });

    // Info control (keeps button in control area and toggles infoBox)
    const InfoControl = L.Control.extend({
      onAdd: function() {
        const btn = L.DomUtil.create('button', 'info-toggle-btn');
        btn.innerHTML = 'ℹ️ Info';
        L.DomEvent.disableClickPropagation(btn);
        btn.onclick = function() {
          const box = document.getElementById('infoBox');
          box.classList.toggle('open');
        };
        return btn;
      },
      onRemove: function() {}
    });
    new InfoControl({ position: 'topright' }).addTo(map);

    // Back button control
    const BackButton = L.Control.extend({
      onAdd: function() {
        const container = L.DomUtil.create('div', 'leaflet-bar leaflet-control');
        const btn = L.DomUtil.create('button', 'back-button', container);
        btn.innerHTML = '⬅️ Back';
        btn.title = 'Return to previous map';
        L.DomEvent.disableClickPropagation(btn);
        const previousMapURL = 'iod.html';
        btn.onclick = function(e) {
          e.stopPropagation();
          window.location.href = previousMapURL;
        };
        return container;
      },
      onRemove: function() {}
    });
    new BackButton({ position: 'topleft' }).addTo(map);

  </script>
</body>
</html>
