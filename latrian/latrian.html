<html>
<head>
  <title>The Latrian Peninsula Map</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="../code/map-base.css">
  <link rel="stylesheet" href="../code/map-ui.css">
  <link rel="stylesheet" href="../code/map-layers.css">

  <style>

  </style>
</head>
<body>
  <div id="map"></div>
  <div id="coords" style="position: fixed; bottom: 10px; left: 10px; color: white; background: rgba(0,0,0,0.5); padding: 4px 8px; border-radius: 4px; font-family: monospace; z-index: 1000;"></div>  
  
  <div class="info-box" id="infoBox">
    <h3>Latrian Peninsula</h3>
    <p>
    Size: ~218,336 km2
    <br>
    <br>
    Scale: 1 : 53 000
    <br>
    <br>
    Nations: 19 Nations ; 7 Landlocked ; 1 Microstate ; 1 Island
  </p>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    const mapWidth = 2048;
    const mapHeight = 2048; 
    const bounds = [[0,0], [mapHeight, mapWidth]];
    const map = L.map('map', {
      crs: L.CRS.Simple,
      minZoom: -1.5,
      maxZoom: 4,
      maxBounds: bounds,
      maxBoundsViscosity: 1.0
    }).fitBounds(bounds);

    map.on('mousemove', function(e) {
  const coordDiv = document.getElementById('coords');
  if (coordDiv) {
    const x = Math.round(e.latlng.lng);
    const y = Math.round(e.latlng.lat);
    coordDiv.innerHTML = `X: ${x}, Y: ${y}`;
  }
});

    
    const blank = L.imageOverlay('../images/latrian/latrian_blank.jpg', bounds).addTo(map);
    const detailed = L.imageOverlay('../images/latrian/latrian_detail.jpg', bounds);
    const temperature = L.imageOverlay('../images/latrian/latrian_temperture.jpg', bounds);
    const culture = L.imageOverlay('../images/latrian/latrian_culture.webp', bounds);
    const political = L.imageOverlay('../images/latrian/latrian_political.jpg', bounds);

    // Overlay groups (info layers)
    const politicalLayer = L.layerGroup();
    const temperatureLayer = L.layerGroup();

    // Nations
    const svardey = L.polygon([
      [186, 1234], [206, 1154], [266, 1112], [266, 1104], [370, 1092], [432, 1106], [508, 1172], [486, 1302], [424, 1396], [242, 1206], [192, 1242]
    ], { color: "transparent", weight: 2, fillOpacity: 0.2 })
      .bindPopup("<b><a href='svardey/svardey.html'>Svardey</a></b>");
    politicalLayer.addLayer(svardey);

    const järvimaa = L.polygon([
      [697, 1110], [727, 1121], [740, 1152], [759, 1135], [835, 1144], [833, 1201], [875, 1211], [893, 1230], [934, 1173], [954, 1177], [966, 1151], [1015, 1143], [1043, 1142], [1043, 1216], [1037, 1264], [1042, 1299], [1033, 1330], [1013, 1376], [981, 1369], [978, 1362], [989, 1351], [847, 1349], [860, 1320], [801, 1338], [718, 1306], [715, 1319], [731, 1326], [733, 1349], [651, 1376], [634, 1332], [587, 1329], [587, 1195], [642, 1122]
    ], { color: "transparent", weight: 2, fillOpacity: 0.2 })
      .bindPopup("<b><a href='svardey/svardey.html'>Järvimaa</a></b>");
    politicalLayer.addLayer(järvimaa);

    const krovia = L.polygon([
      [1618, 1104], [1644, 1099], [1669, 1124], [1673, 1147], [1717, 1185], [1743, 1217], [1767, 1210], [1772, 1208], [1795, 1227], [1808, 1329], [1786, 1363], [1788, 1365], [1749, 1362], [1725, 1298], [1697, 1303], [1650, 1257], [1620, 1258], [1656, 1158], [1644, 1133],
    ], { color: "transparent", weight: 2, fillOpacity: 0.2 })
      .bindPopup("<b><a href='krovia/krovia.html'>Krovia</a></b>");
    politicalLayer.addLayer(krovia);

    const cathracha = L.polygon([
      [1403, 1210], [1356, 1261], [1360, 1352], [1395, 1417], [1368, 1437], [1411, 1499], [1437, 1607], [1433, 1535], [1442, 1505], [1465, 1488], [1418, 1432], [1416, 1397], [1439, 1318],   
    ], { color: "transparent", weight: 2, fillOpacity: 0.2 })
      .bindPopup("<b><a href='cathracha/cathracha.html'>Cathracha</a></b>");
    politicalLayer.addLayer(cathracha);

    const grodnica = L.polygon([
      [1407, 946], [1389, 962], [1419, 975], [1429, 967],

      .bindPopup("<b><a href='grodnica/grodnica.html'>Grodnica</a></b>");
    politicalLayer.addLayer(grodnica);

    const belomirja = L.polygon([
      [1037,1136],[976,1154],[965,1144],[891,1216],[843,1135],[691,1102],[684,964],[788,622],[935,497],[1108,651],[1085,700],[1128,708],[1157,767],[1145,813],[1268,875],[918,888],[915,968],[853,1029],[1018,1090]

    const varynska = L.polygon([

    const svardoržava = L.polygon([

    ], { color: "transparent", weight: 2, fillOpacity: 0.2 })
      .bindPopup("<b><a href='cathracha/cathracha.html'>Svardoržava</a></b>");
    politicalLayer.addLayer(svardoržava);

    const tunniit = L.polygon([
      [1276,871],[1168,815],[1145,792],[1164,732],[1080,683],[1114,654],[1097,384],[1331,553],[1336,599],[1267,661],[1469,879],[1356,964],[1295,911],[1313,880]
    ], { color: "transparent", weight: 2, fillOpacity: 0.2 })
      .bindPopup("<b><a href='cathracha/cathracha.html'>Tunniit</a></b>");
    politicalLayer.addLayer(tunniit);

    const svarnuk = L.polygon([
      [1279,880], [1327,953], [1387,954], [1412,980], [1393,1204], [1355,1336], [1324,1334],[1282,1237], [1234,1224], [1130,1282], [1153,1340],[1100,1360],[1045,1339],[1048,1147],[1019,1079],[857,1028],[948,906]
    ], { color: "transparent", weight: 2, fillOpacity: 0.2 })

    const nunarsuaq = L.polygon([

    const iskaldur = L.polygon([

    ], { color: "transparent", weight: 2, fillOpacity: 0.2 })

    const caletā = L.polygon([

    ], { color: "transparent", weight: 2, fillOpacity: 0.2 })
      .bindPopup("<b><a href='cathracha/cathracha.html'>Caletā</a></b>");
    politicalLayer.addLayer(caletā);

    const čerzemь = L.polygon([
      [1787,678],[1924,734],[1926,877],[1775,936],[1739,848],[1795,707]
    ], { color: "transparent", weight: 2, fillOpacity: 0.2 })
      .bindPopup("<b><a href='cathracha/cathracha.html'>Čerzemь</a></b>");
    politicalLayer.addLayer(čerzemь);

    const valtamaa = L.polygon([
      [1976,414],[2048,414],[2048,781],[1931,868],[1933,710],[1835,717],[1836,672],[1786,666],[1774,623],[1774,615],[1822,628],[1920,568]
    ], { color: "transparent", weight: 2, fillOpacity: 0.2 })
      .bindPopup("<b><a href='cathracha/cathracha.html'>Valtamaa</a></b>");
    politicalLayer.addLayer(valtamaa);

    const götwarda = L.polygon([
      [2048,813],[1720,974],[1723,1032],[1776,1083],[1724,1139],[1724,1181],[1800,1217],[2048,1332]
    ], { color: "transparent", weight: 2, fillOpacity: 0.2 })
      .bindPopup("<b><a href='cathracha/cathracha.html'>Götwarda</a></b>");
    politicalLayer.addLayer(götwarda);

    const morik̑anos = L.polygon([
      [1742,1369],[1678,1859],[1421,1810],[1450,1516],[1471,1477],[1430,1410],[1442,1284],[1583,1253]
    ], { color: "transparent", weight: 2, fillOpacity: 0.2 })
      .bindPopup("<b><a href='cathracha/cathracha.html'>Morik̑anos</a></b>");
    politicalLayer.addLayer(morik̑anos);

    const albionā = L.polygon([
      [1264,1419],[1387,1466],[1431,1605],[1333,1856],[1097,1774],[1113,1689],[990,1668],[1143,1553],[1200,1542],[1301,1605],[1311,1534],[1235,1485],[1263,1442],[1353,1474]
    ], { color: "transparent", weight: 2, fillOpacity: 0.2 })
      .bindPopup("<b><a href='cathracha/cathracha.html'>Albionā</a></b>");
    politicalLayer.addLayer(albionā);

    const dūnoregis = L.polygon([
      [1135,1541],[979,1664],[1104,1698],[1065,1850],[854,1640],[869,1565],[1022,1475]
    ], { color: "transparent", weight: 2, fillOpacity: 0.2 })
      .bindPopup("<b><a href='cathracha/cathracha.html'>Dūnoregis</a></b>");
    politicalLayer.addLayer(dūnoregis);

    // Example climate markers (only for Temperature map)
    const ecoldZone = L.marker([218, 1180], {
      icon: L.divIcon({
        className: 'temp-label',
        html: '-15°C',
        iconSize: [50, 20],
        iconAnchor: [25, 10]
      })
    });
    const lcoldZone = L.marker([370, 1154], {
      icon: L.divIcon({
        className: 'temp-label',
        html: '5°C',
        iconSize: [50, 20],
        iconAnchor: [25, 10]
        })
    });
    const mcoldZone = L.marker([892, 1111], {
      icon: L.divIcon({
        className: 'temp-label',
        html: '5°C',
        iconSize: [50, 20],
        iconAnchor: [25, 10]
        })
    });
    const coldZone = L.marker([1555, 1070], {
      icon: L.divIcon({
        className: 'temp-label',
        html: '7°C',
        iconSize: [50, 20],
        iconAnchor: [25, 10]
      })
    });
    const scoldZone = L.marker([2000, 738], {
      icon: L.divIcon({
        className: 'temp-label',
        html: '9°C',
        iconSize: [50, 20],
        iconAnchor: [25, 10]
        })
    });

    temperatureLayer.addLayer(ecoldZone);
    temperatureLayer.addLayer(lcoldZone);
    temperatureLayer.addLayer(mcoldZone);
    temperatureLayer.addLayer(coldZone);
    temperatureLayer.addLayer(scoldZone);

    const baseMaps = {
      "Blank": blank,
      "Detailed": detailed,
      "Temperature": temperature,
      "Culture": culture,
      "Political": political
    };

    L.control.layers(baseMaps, null).addTo(map);

    map.on('baselayerchange', function(e) {
      map.removeLayer(politicalLayer);
      map.removeLayer(temperatureLayer);

      if (e.name === "Political") {
        map.addLayer(politicalLayer);
      } else if (e.name === "Temperature") {
        map.addLayer(temperatureLayer);
      }

    });

    const InfoControl = L.Control.extend({
      onAdd: function() {
        const btn = L.DomUtil.create('button', 'info-toggle-btn');
        btn.innerHTML = 'ℹ️ Info';
        L.DomEvent.disableClickPropagation(btn);
        btn.onclick = function() {
          const box = document.getElementById('infoBox');
          box.classList.toggle('open'); // uses your CSS .info-box.open rules
        };
        return btn;
      },
      onRemove: function() {}
    });
    
    new InfoControl({ position: 'topright' }).addTo(map);
const BackButton = L.Control.extend({
  onAdd: function() {
    const container = L.DomUtil.create('div', 'leaflet-bar leaflet-control');
    const btn = L.DomUtil.create('button', '', container);
    btn.id = 'back-button';
    btn.innerHTML = '← Back';
    btn.title = 'Return to previous map';

    // Prevent map drag when clicking
    L.DomEvent.disableClickPropagation(btn);

    // Set your custom back target here (relative or absolute URL)
    const previousMapURL = '../frexis.html'; // <-- change manually per map

    btn.onclick = function(e) {
      e.stopPropagation();
      window.location.href = previousMapURL;
    };

    return container;
  },
  onRemove: function() {}
});

// Add it to top-left next to zoom controls
new BackButton({ position: 'topleft' }).addTo(map);

  </script>
</body>
</html>
