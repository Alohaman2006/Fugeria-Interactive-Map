<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="code/map-base.css">
  <link rel="stylesheet" href="code/map-ui.css">
  <link rel="stylesheet" href="code/map-layers.css">
<title>Pantheon</title>
<style>

body {
    font-family: "Segoe UI", sans-serif;
    background: #1a1a1a;
    margin: 0;
    color: #eee;
}

/* --- CONTAINER --- */
.codex-container {
    width: 80%;
    max-width: 1500px;
    margin: 40px auto;
    background: #222;
    padding: 20px;
    border-radius: 14px;
    box-shadow: 0 0 20px #000;
    position: relative;
}

/* --- SLIDE AREA --- */
.god-slide {
    display: flex;
    gap: 20px;
    align-items: center;
    opacity: 0;
    transition: opacity 0.4s ease;
}

/* --- LEFT IMAGE --- */
.god-image {
    width: 45%;
    min-height: 1000px;
    background-size: cover;
    background-position: center;
    filter: brightness(0.7) blur(0.5px);
    border-radius: 10px;
    opacity: 0.85;
}

/* --- RIGHT TEXT --- */
.god-info {
    width: 55%;
}

.god-info h2 {
    margin-top: 0;
    font-size: 26px;
    border-bottom: 1px solid #444;
    padding-bottom: 6px;
}

/* --- NAVIGATION BUTTONS --- */
.nav-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    padding: 10px 14px;
    background: #333;
    color: white;
    border: none;
    cursor: pointer;
    border-radius: 50%;
    font-size: 20px;
}

.nav-btn:hover {
    background: #555;
}

#prevBtn { left: -50px; }
#nextBtn { right: -50px; }

</style>
</head>
<body>

<div class="codex-container">

    <button id="prevBtn" class="nav-btn">◀</button>
    <button id="nextBtn" class="nav-btn">▶</button>
    <button id="backBtn" class="nav-btn" style="top: 20px; left: 20px; transform: none;">← Back</button>

// --- RENDER FUNCTION --- //
function renderSlide() {
    const container = document.getElementById("slides");
    const g = gods[index];

    container.innerHTML = `
        <div class="god-slide" style="opacity: 0">
            <div class="god-image" style="background-image: url('${g.image}')"></div>

            <div class="god-info">
                <h2>${g.name} — <span style="font-size:18px; color:#bbb">${g.title}</span></h2>
                <p>${g.lore}</p>
            </div>
        </div>
    `;

    setTimeout(() => {
        document.querySelector(".god-slide").style.opacity = 1;
    }, 50);
}

// --- NAVIGATION --- //
document.getElementById("nextBtn").onclick = () => {
    index = (index + 1) % gods.length;
    renderSlide();
};

document.getElementById("prevBtn").onclick = () => {
    index = (index - 1 + gods.length) % gods.length;
    renderSlide();
};

// --- INITIAL LOAD --- //
renderSlide();

// --- BACK BUTTON --- //
document.getElementById("backBtn").onclick = () => {
    window.location.href = "index.html";
};

</script>

</body>
</html>
