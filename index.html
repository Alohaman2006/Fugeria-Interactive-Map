<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="code/map-base.css">
    <link rel="stylesheet" href="code/map-ui.css">
    <title>Fugeria</title>
    <style>
      body { margin: 0; overflow: hidden; }
      .info-toggle-btn {
        position: absolute;
        top: 10px;
        right: 10px;
        background: #000000;
        color: white;
        border: 1px solid #000000;
        border-radius: 6px;
        padding: 6px 10px;
        cursor: pointer;
        font-size: 14px;
        font-family: sans-serif;
        transition: background 0.2s;
        z-index: 2000;
      }
      .info-toggle-btn:hover {
        background: #555;
      }
      #pantheonBtn {
        position: absolute;
        top: 10px;
        left: 10px; /* top-left */
        background: #000000;
        color: white;
        border: 1px solid #000000;
        border-radius: 6px;
        padding: 6px 10px;
        cursor: pointer;
        font-size: 14px;
        z-index: 2000;
      }

      #pantheonBtn:hover {
        background: #222222;
      }
    </style>

    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
    </script>
  </head>

  <body>
    <button id="pantheonBtn">Pantheon</button>
    <button class="info-toggle-btn" id="infoBtn">Lands</button>

    <div class="info-box" id="infoBox">
      <h3>Fugeria</h3>
      <p>
        <h4>Lands</h4>
        <a href="fraxis.html">The Fraxis Continet</a>.
      </p>
    </div>

    <script type="module" src="code/threejs.js"></script>

    <script>
      document.getElementById("infoBtn").addEventListener("click", function() {
        const box = document.getElementById("infoBox");
        box.classList.toggle("open");
      });
    </script>

    <script>
document.getElementById("pantheonBtn").addEventListener("click", () => {
  window.location.href = "pantheon.html";
});
</script>

  </body>
</html>
