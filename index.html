<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="code/map-base.css">
    <link rel="stylesheet" href="code/map-ui.css">
    <title>Fugeria</title>
    <style>
      
      body { margin: 0; overflow: hidden; }
      .info-toggle-btn {
        position: absolute;
        top: 10px;
        right: 10px;
        background: #000000;
        color: white;
        border: 1px solid #000000;
        border-radius: 6px;
        padding: 6px 10px;
        cursor: pointer;
        font-size: 14px;
        font-family: sans-serif;
        transition: background 0.2s;
        z-index: 2000;
      }
      .info-toggle-btn:hover {
        background: #555;
      }

      /* Sidebar styles */
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        height: 100vh;
        background: rgba(30, 30, 30, 0.95);
        transition: transform 0.3s ease;
        z-index: 2000;
        display: flex;
        flex-direction: column;
        width: 200px;
      }

      .sidebar.closed {
        transform: translateX(-100%);
      }

      .sidebar-toggle {
        position: fixed;
        left: 10px;
        top: 10px;
        background: #000000;
        color: white;
        border: 1px solid #000000;
        border-radius: 6px;
        padding: 6px 10px;
        cursor: pointer;
        font-size: 14px;
        font-family: sans-serif;
        z-index: 2001;
        transition: background 0.2s;
      }

      .sidebar-toggle:hover {
        background: #222222;
      }

      .sidebar-content {
        padding: 70px 15px 20px 15px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .sidebar-btn {
        background: #222222;
        color: white;
        border: 1px solid #555;
        border-radius: 6px;
        padding: 10px 12px;
        cursor: pointer;
        font-size: 14px;
        font-family: sans-serif;
        transition: background 0.2s;
        text-align: center;
        text-decoration: none;
        display: block;
      }

      .sidebar-btn:hover {
        background: #444444;
      }
    </style>

    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
    </script>
  </head>

  <body>
    <button class="sidebar-toggle" id="sidebarToggle">☰</button>

    <div class="sidebar closed" id="sidebar">
      <div class="sidebar-content">
        <button class="sidebar-btn" id="landsBtn">Map</button>
        <button class="sidebar-btn" id="pantheonBtn">Pantheon</button>
        <a href="https://alohaman2006.github.io/Bestiary/" class="sidebar-btn">Beastiary</a>
      </div>
    </div>


    <script type="module" src="code/threejs.js"></script>

    <script>
      // Sidebar toggle
      document.getElementById("sidebarToggle").addEventListener("click", function() {
        const sidebar = document.getElementById("sidebar");
        sidebar.classList.toggle("closed");
      });

      // Frexis button: redirect to frexis.html
      document.getElementById("landsBtn").addEventListener("click", function() {
        window.location.href = "map.html";
      });

      // Pantheon button
      document.getElementById("pantheonBtn").addEventListener("click", () => {
        window.location.href = "pantheon.html";
      });
    </script>

  </body>
</html>
